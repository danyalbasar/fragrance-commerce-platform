services:
  model:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODEL_REVISION: ${MODEL_REVISION:-7ae557604adf67be50417f59c2c2f167def9a775}
    restart: unless-stopped
    environment:
      CHATBOT_SERVICE_KEY: ${CHATBOT_SERVICE_KEY:?Run configure_deployment.py first}
      CHATBOT_REQUIRE_SERVICE_KEY: "true"
      CHATBOT_THREADS: "2"
    ports:
      - "127.0.0.1:8001:8001"

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      AI_HOST: ${AI_HOST:?Run configure_deployment.py first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      model:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
